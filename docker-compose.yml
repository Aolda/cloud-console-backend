version: '3.8'

services:
  mariadb:
    image: mariadb:11.1
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080"
