app:
  capture:
    enabled: true
    project-id: ${APP_CAPTURE_PROJECT_ID}
    keystone:
      username: ${OPENSTACK_BFF_USERNAME}
      password: ${OPENSTACK_BFF_PASSWORD}
      domain: "Default"
    prefer-token-scope: system
    neutron:
      networks: true
      ports: true
      security-groups: true
      security-group-rules: true
      subnets: true
      routers: true
      floatingips: true
      write:
        enabled: true
        networks: true
        security-groups: true
    nova:
      servers: true
      servers-detail: true
      keypairs: true
      limits: true
      write:
        enabled: false
        keypairs: true
    glance:
      images: true
      tasks: true
    cinder:
      volumes: true
      volumes-detail: true
      snapshots: true
      backups: true
      limits: true
    extra:
      nova:
        port: 8774
        uris: []
      glance:
        port: 9292
        uris: []
      cinder:
        port: 8776
        uris: []
    auto-follow:
      enabled: true
      nova:
        servers-limit: 5
        flavors-limit: 5
      glance:
        images-limit: 5
      cinder:
        volumes-limit: 5
        snapshots-limit: 5
        backups-limit: 5
    sweep:
      enabled: true
      nova: true
      glance: true
      cinder: true
    rate:
      sleep-ms: 800
      jitter-ms: 1200
      retries: 6
      backoff-ms: 1000
      cooldown-every: 10
      cooldown-ms: 15000
      startup-warmup-ms: 3000

spring:
  main:
    banner-mode: "off"
