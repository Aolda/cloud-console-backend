acc:
  openstack:
    components:
      keystone:
        port: 5000
      nova:
        port: 8774
      cinder:
        port: 8776
      glance:
        port: 9292
      neutron:
        port: 9696
    resilience:
      default-component: default-config

resilience4j:
  circuitbreaker:
    configs:
      default-config:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true

    instances:
      cb-default:
        baseConfig: default-config

      cb-keystone:
        baseConfig: default-config
        failureRateThreshold: 40
        waitDurationInOpenState: 3s

      cb-glance:
        baseConfig: default-config
        failureRateThreshold: 45
        waitDurationInOpenState: 3s

      cb-nova:
        baseConfig: default-config
        failureRateThreshold: 55
        waitDurationInOpenState: 5s

      cb-cinder:
        baseConfig: default-config
        failureRateThreshold: 55
        waitDurationInOpenState: 5s

      cb-neutron:
        baseConfig: default-config
        failureRateThreshold: 55
        waitDurationInOpenState: 5s

      cb-apm:
        baseConfig: default-config
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

      cb-discord:
        baseConfig: default-config
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 20
        failureRateThreshold: 80
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

      cb-email:
        baseConfig: default-config
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 30
        minimumNumberOfCalls: 20
        failureRateThreshold: 70
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

  retry:
    configs:
      default-off:
        maxAttempts: 1
        waitDuration: 0ms

      # ✅ 블랙리스트 전략: 예외 타입 나열(retryExceptions) 제거
      # "몇 번/간격"만 yml에서 관리
      default-get:
        maxAttempts: 3
        waitDuration: 200ms

      default-post:
        maxAttempts: 1
        waitDuration: 0ms

    instances:
      retry-default-get:
        baseConfig: default-off
      retry-default-post:
        baseConfig: default-off
      retry-default-put:
        baseConfig: default-off
      retry-default-patch:
        baseConfig: default-off
      retry-default-delete:
        baseConfig: default-off
      retry-default-head:
        baseConfig: default-off
      retry-default-options:
        baseConfig: default-off

      retry-keystone-get:
        baseConfig: default-get
      retry-nova-get:
        baseConfig: default-get
      retry-cinder-get:
        baseConfig: default-get
      retry-glance-get:
        baseConfig: default-get
      retry-neutron-get:
        baseConfig: default-get

      retry-keystone-token-issue:
        baseConfig: default-get

      retry-keystone-post:
        baseConfig: default-off
      retry-glance-post:
        baseConfig: default-off
      retry-glance-put:
        baseConfig: default-off
      retry-nova-post:
        baseConfig: default-off
      retry-nova-put:
        baseConfig: default-off
      retry-nova-delete:
        baseConfig: default-off
      retry-cinder-post:
        baseConfig: default-off
      retry-cinder-put:
        baseConfig: default-off
      retry-cinder-delete:
        baseConfig: default-off
      retry-neutron-post:
        baseConfig: default-off
      retry-neutron-put:
        baseConfig: default-off
      retry-neutron-delete:
        baseConfig: default-off

      retry-apm-write:
        baseConfig: default-off
      retry-apm-read:
        baseConfig: default-get

      retry-discord-post:
        baseConfig: default-off
      retry-email-post:
        baseConfig: default-off
