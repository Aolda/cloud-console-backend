name: "✨ 기능 요청"
description: "새로운 기능을 제안합니다"
title: "[Feature] "
labels: ["feature"]

body:

- type: markdown
  attributes:
    value: |
      새로운 기능이나 개선 아이디어를 제안해주세요.

- type: input
  id: summary
  attributes:
    label: 기능 요약
    description: 추가하고 싶은 기능을 한 줄로 설명해주세요
    placeholder: OAuth 로그인 기능 추가
  validations:
    required: true

- type: textarea
  id: problem
  attributes:
    label: 해결하려는 문제
    description: 어떤 문제를 해결하기 위한 기능인지 설명해주세요
  validations:
    required: true

- type: textarea
  id: solution
  attributes:
    label: 제안하는 해결 방법
    description: 어떤 방식으로 기능을 구현하면 좋을지 설명해주세요

- type: textarea
  id: alternatives
  attributes:
    label: 고려했던 다른 방법
    description: 다른 해결 방법이 있었다면 작성해주세요

- type: dropdown
  id: priority
  attributes:
    label: 우선순위
    description: 기능의 중요도를 선택해주세요
    options:
      - P0 (매우 중요)
      - P1 (높음)
      - P2 (보통)
      - P3 (낮음)