name: "📌 일반 작업"
description: "일반 개발 작업이나 태스크를 생성합니다"
title: "[Task] "
labels: ["task"]

body:

- type: markdown
  attributes:
    value: |
      일반적인 개발 작업이나 내부 태스크를 작성할 때 사용하는 템플릿입니다.

- type: input
  id: summary
  attributes:
    label: 작업 요약
    description: 작업 내용을 한 줄로 간단히 작성해주세요
    placeholder: 사용자 프로필 조회 API 구현
  validations:
    required: true

- type: dropdown
  id: priority
  attributes:
    label: 우선순위
    description: 작업의 중요도를 선택하세요
    options:
      - P0 (매우 중요)
      - P1 (높음)
      - P2 (보통)
      - P3 (낮음)
    default: 2
  validations:
    required: true

- type: dropdown
  id: component
  attributes:
    label: 관련 컴포넌트
    description: 어떤 영역과 관련된 작업인지 선택하세요
    options:
      - auth
      - project
      - instance
      - network
      - storage
      - quick-start
      - devops
      - etc

- type: textarea
  id: description
  attributes:
    label: 작업 설명
    description: 작업의 상세 내용을 작성해주세요

- type: textarea
  id: acceptance
  attributes:
    label: 완료 조건 (Acceptance Criteria)
    description: 이 작업이 완료되었다고 판단할 기준을 작성해주세요
    value: |
      - [ ] 조건 1
      - [ ] 조건 2